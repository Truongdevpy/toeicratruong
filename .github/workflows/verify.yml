name: TOEIC Platform CI Verification Suite

on:
  push:
    branches: [ main, feat-*, fix-* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test asset restoration
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Restore and verify runtime assets
        run: python tools/restore_assets.py

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Platform Verify Suite
        run: python scripts/run_verify.py
